version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cinema-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema_db
    ports:
      - "5432:5432"
    volumes:
      - cinema_pgdata:/var/lib/postgresql/data

volumes:
  cinema_pgdata: